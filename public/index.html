<h2>Create an Account</h2>
<form id="signup-form">
  <p>
    <label for="fullname">Full Name:</label><br>
    <input type="text" id="fullname" name="fullname" required>
  </p>

  <p>
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required>
  </p>

  <p>
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required>
  </p>

  <p>
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required>
  </p>

  <p>
    <label for="sec">Security Questions:</label><br>
    <textarea id="sec" name="sec" rows="4"></textarea>
  </p>
<div class="g-recaptcha" data-sitekey="6LfiHNMsAAAAAAVgvU_qhGy_eLVW6MStlObPHPs7"></div>
  <button type="submit">Create Account</button>
</form>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <!-- Following a tutorial for the recaptcha token auth below -->
    <script>

  const form = document.getElementById('signup-form');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    alert('submit handler is running');

    const token = grecaptcha.getResponse();

    if (!token) {
      alert('Please complete the reCAPTCHA.');
      return;
    }

    const data = {
      fullname: document.getElementById('fullname').value,
      email: document.getElementById('email').value,
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
      sec: document.getElementById('sec').value,
      token: token
    };

    const response = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.ok) {
      alert('Account created successfully!');
      form.reset();
      grecaptcha.reset();
    } else {
      alert(result.message || 'Something went wrong.');
      grecaptcha.reset();
    }
  });
</script>
